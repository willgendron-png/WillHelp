<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8f1d2c">
<title>WillHelp</title>
<style>
:root{
  --red:#8f1d2c; --red-d:#6e1421; --red-l:#f7e9eb; --ink:#1d1b1c; --ink2:#4a4547; --muted:#6b6467;
  --bg:#faf8f6; --card:#ffffff; --line:#e4dedb; --ok:#1f6b3a; --ok-l:#e6f3ea; --warn:#8a5a00; --warn-l:#fff4dc;
  --info:#1f4e79; --info-l:#e8f0f8; --focus:#1f4e79; --r:14px; --fs:1rem;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale,1))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--red-d)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:.75rem 1rem;z-index:99}
.skip:focus{left:.5rem;top:.5rem}
header.top{background:var(--red);color:#fff;padding:.7rem 1rem;display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:20}
.mark{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:none}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:.2px}
.brand small{display:block;font-weight:500;font-size:.78rem;opacity:.9}
.top .spacer{flex:1}
.top button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:10px;min-height:40px;padding:0 .7rem;font:inherit;font-size:.85rem;cursor:pointer}
.demo-banner{background:var(--warn-l);color:var(--warn);border-bottom:1px solid #f0d9a6;padding:.5rem 1rem;font-size:.88rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.layout{display:flex;max-width:1180px;margin:0 auto}
nav.main{display:flex}
nav.main a{text-decoration:none;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:600;min-height:56px;flex:1}
nav.main a svg{width:24px;height:24px}
nav.main a[aria-current="page"]{color:var(--red)}
@media (max-width:859px){
  nav.main{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  main{padding-bottom:90px}
}
@media (min-width:860px){
  nav.main{flex-direction:column;width:200px;flex:none;padding:1rem .5rem;position:sticky;top:62px;align-self:flex-start;gap:.25rem}
  nav.main a{flex-direction:row;justify-content:flex-start;gap:.7rem;padding:0 1rem;border-radius:12px;font-size:.98rem}
  nav.main a[aria-current="page"]{background:var(--red-l)}
}
main{flex:1;min-width:0;padding:1rem;max-width:860px}
h1{font-size:1.6rem;line-height:1.25;margin:.4rem 0 .25rem}
h2{font-size:1.2rem;margin:1.4rem 0 .5rem}
h3{font-size:1.05rem;margin:.2rem 0 .3rem}
p{margin:.35rem 0 .7rem}
.lead{color:var(--ink2);margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin:.75rem 0}
.card.tint{background:var(--red-l);border-color:#ecd0d4}
.grid{display:grid;gap:.75rem}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;margin:.75rem 0}
.bigbtn{overflow-wrap:anywhere;hyphens:auto;display:flex;flex-direction:column;justify-content:center;min-height:84px;padding:.8rem;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:1rem;cursor:pointer;text-align:left}
.bigbtn span{font-weight:400;font-size:.82rem;color:var(--muted)}
.bigbtn:hover{border-color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:46px;padding:0 1rem;border-radius:12px;border:1.5px solid var(--red);background:var(--red);color:#fff;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}
.btn.sec{background:#fff;color:var(--red-d)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--red-d);padding:0 .5rem}
.btn.small{min-height:38px;font-size:.88rem;padding:0 .75rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;background:#eee;color:var(--ink2);vertical-align:middle}
.b-ok{background:var(--ok-l);color:var(--ok)} .b-warn{background:var(--warn-l);color:var(--warn)} .b-info{background:var(--info-l);color:var(--info)} .b-red{background:var(--red-l);color:var(--red-d)}
.note{font-size:.85rem;color:var(--muted)}
.ctx{font-size:.85rem;color:var(--info);background:var(--info-l);border-radius:10px;padding:.45rem .65rem;margin:.5rem 0}
.warnbox{font-size:.9rem;color:var(--warn);background:var(--warn-l);border-radius:10px;padding:.6rem .75rem;margin:.6rem 0}
label.f{display:block;margin:.85rem 0}
.prompt{display:block;font-weight:600;margin-bottom:.1rem}
.flabel{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.3rem}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;font:inherit;padding:.65rem .75rem;border:1.5px solid #cfc8c5;border-radius:10px;background:#fff;color:var(--ink);min-height:46px}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem 0;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--red)}
.meter{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:.4rem}.meter span{display:block;height:100%;background:var(--ok)}
.opp .quick{margin:.35rem 0;font-size:.95rem}.opp .fitline{margin:.35rem 0;font-size:.92rem;color:var(--ink2);font-weight:600}details.more{margin:.4rem 0}details.more>summary{cursor:pointer;font-weight:700;color:var(--red-d);min-height:44px;display:flex;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;padding:.2rem 0 .5rem}
.tabs a{white-space:nowrap;text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:.45rem .9rem;color:var(--ink2);font-weight:600;font-size:.9rem;background:#fff;min-height:40px;display:inline-flex;align-items:center}
.tabs a[aria-current="true"]{border-color:var(--red);color:var(--red-d);background:var(--red-l)}
.step{border-left:4px solid var(--red);}
.step .tag{font-size:.78rem;color:var(--muted)}
.list-item{border-top:1px solid var(--line);padding:.7rem 0}
.list-item:first-child{border-top:0}
.kv{display:grid;grid-template-columns:minmax(90px,32%) minmax(0,1fr);overflow-wrap:anywhere;gap:.25rem .75rem;font-size:.92rem;margin:.5rem 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.course{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.course select{min-height:40px;padding:.3rem .5rem;width:auto}
.ph{background:#fff3c4;border-bottom:2px dotted #c49000;padding:0 .15rem}
.doc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1.4rem 1.5rem;font-family:Georgia,"Times New Roman",serif;color:#111;line-height:1.4;font-size:.95rem}
.doc h1{font-family:inherit;font-size:1.5rem;margin:0}
.doc .contact{font-size:.88rem;margin:.2rem 0 .6rem}
.doc h2{font-family:inherit;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #444;margin:1rem 0 .4rem;padding-bottom:.1rem}
.doc ul{margin:.2rem 0 .4rem 1.1rem;padding:0}
.doc .ent{margin:.35rem 0}
.doc .ent b{font-weight:700}
.doc[contenteditable="true"]{outline:3px dashed var(--info)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#222;color:#fff;padding:.7rem 1rem;border-radius:10px;z-index:50;max-width:90vw;font-size:.92rem}
@media (min-width:860px){.toast{bottom:24px}}
footer.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:2rem;padding-top:1rem}
details summary{cursor:pointer;font-weight:650;min-height:40px;display:flex;align-items:center}
.pill-row{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.4rem .8rem;font:inherit;font-size:.9rem;cursor:pointer;min-height:40px}
.pill[aria-pressed="true"]{border-color:var(--red);background:var(--red-l);color:var(--red-d);font-weight:650}
.stage-list button{display:block;width:100%;text-align:left;margin:.35rem 0}.stage-list button.picked{background:var(--red);color:#fff;border-color:var(--red)}.stage-list button.picked .note{color:#fff}
.status-track{display:flex;flex-wrap:wrap;gap:.3rem;margin:.5rem 0}
.status-track span{font-size:.75rem;padding:.25rem .5rem;border-radius:8px;background:#eee;color:var(--muted)}
.status-track span.done{background:var(--ok-l);color:var(--ok)}
.status-track span.cur{background:var(--red);color:#fff;font-weight:700}
.tour-preview{position:relative;border:2px dashed #cfc8c5;border-radius:var(--r);padding:2rem .75rem .75rem;margin:.75rem 0;background:#fdfcfb;pointer-events:none;user-select:none}
.tour-preview::before{content:"Example screen: Willa is made up";position:absolute;top:.5rem;left:.75rem;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tour-why{background:var(--info-l);color:var(--ink);border-radius:12px;padding:.75rem .9rem;margin:.75rem 0}
.tour-why b{color:var(--info)}
.dots{display:flex;gap:.35rem;flex-wrap:wrap;margin:.25rem 0 .5rem}
.dots span{width:10px;height:10px;border-radius:50%;background:#ddd5d2}
.dots span.on{background:var(--red)}
.tour-nav{display:flex;gap:.5rem;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:1rem}
.tour-cta{display:flex;align-items:center;gap:.9rem;background:#1d5fb4;border-radius:var(--r);padding:.95rem 1rem;margin:.9rem 0;color:#fff;text-decoration:none}
.tour-cta:hover{background:#174d93}
.tour-cta:focus-visible{outline:3px solid #0b2f5e;outline-offset:3px}
.tour-cta .ico{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#1d5fb4;display:grid;place-items:center}
.tour-cta .ico svg{width:20px;height:20px;margin-left:3px}
.tour-cta .txt{flex:1;min-width:0}
.tour-cta .txt b{display:block;font-size:1.08rem;color:#fff}
.tour-cta .txt span{font-size:.9rem;color:#e6efff}
.tour-cta .go{flex:none;background:#fff;color:#1d5fb4;border-radius:10px;padding:.55rem .9rem;font-weight:700;font-size:.92rem}
@media (max-width:420px){.tour-cta .go{display:none}}
.grid.two{grid-template-columns:1fr 1fr}
@media (max-width:560px){.grid.two{grid-template-columns:1fr}}
.stale-note{display:flex;gap:.6rem;align-items:center;justify-content:space-between;background:var(--warn-l);color:var(--warn);border:1px solid #f0d9a6;border-radius:12px;padding:.6rem .75rem;margin:.6rem 0;font-size:.92rem}
.match{display:inline-block;background:#e6f3ea;color:#1f6b3a;font-weight:700;font-size:.8rem;border-radius:8px;padding:.2rem .5rem;margin:.1rem .2rem .3rem 0}
.sup-list{margin:.2rem 0 .7rem 1.1rem;padding:0}
.sup-list li{margin:.2rem 0}
.btn.green{background:#1f7a3f;border-color:#1f7a3f;color:#fff}
.btn.green:hover{background:#18632f}
.btn.wide{width:100%;min-height:54px;font-size:1.05rem}
.sugg-box{background:#f4f8f2;border:1px solid #cfe3c8;border-radius:12px;padding:.7rem .8rem;margin:.2rem 0 .8rem}
.sugg-box .pill{margin:.2rem .1rem;text-align:left}
.sugg-row{display:flex;gap:.6rem;align-items:center;justify-content:space-between;border-top:1px solid #dcebd6;padding:.5rem 0}
.sugg-row:first-of-type{border-top:0}
#print-area{display:none}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;left:0;top:0;width:100%}
  #print-area .doc{border:0;padding:0}
  .ph{background:none;border:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

function deepMerge(base,over){
  if(Array.isArray(base)) return over!==undefined?over:base;
  if(base&&typeof base==="object"){const o={...base};for(const k in over){o[k]=(k in base)?deepMerge(base[k],over[k]):over[k]}return o}
  return over!==undefined?over:base;
}

/* ------------------------- milestone engine ------------------------- */
function ruleMatches(r){
  const w=r.when||{};
  if(w.completed&&!w.completed.every(done))return false;
  if(w.notStarted&&!w.notStarted.every(c=>!active(c)))return false;
  if(w.anyActive&&!w.anyActive.some(active))return false;
  if(w.untilAllCompleted&&w.untilAllCompleted.every(done))return false;
  if(w.unlessHeld&&heldKeys().has(w.unlessHeld))return false;
  return true;
}
function nextSteps(){
  const steps=[];
  if(anyCourseData()) DATA.rules.filter(ruleMatches).forEach(r=>steps.push({...r}));
  // credential reminders
  state.profile.credentials.forEach(c=>{if(c.expires){const d=daysUntil(c.expires);if(d<=60)steps.push({id:"exp-"+c.id,priority:d<0?1:3,title:d<0?`${c.name||"A credential"} has expired`:`${c.name||"A credential"} expires in ${d} day${d===1?"":"s"}`,body:"Tell me whether you need a renewal class, or check whether your school or employer covers it.",link:"#opps-bls",linkLabel:"See BLS and ACLS classes"})}});
  // clinical paperwork reminders (dates only)
  (state.compliance||[]).forEach(c=>{if(c.due){const d=daysUntil(c.due);if(d<=45)steps.push({id:"cmp-"+c.id+"-"+c.due,priority:d<0?1:3,title:d<0?`${c.label||"Clinical paperwork"} is past due`:`${c.label||"Clinical paperwork"} due in ${d} day${d===1?"":"s"}`,body:"Expired clinical paperwork can keep you out of clinical. Check what your school or site needs to renew it.",link:"#journey-paperwork",linkLabel:"Open clinical paperwork"})}});
  // RN license roadmap near graduation
  {const g=state.profile.education.expectedGrad;if(g){const d=daysUntil(g);const L=DATA.license;if(L&&d<=150&&d>=-365&&!steps.some(x=>x.id==="grad")){const left=L.steps.filter(x=>!state.license.done[x.id]).length;if(left)steps.push({id:"lic-road",priority:d<=60?2:4,title:`RN license: ${left} step${left===1?"":"s"} left`,body:d>=0?`You graduate in about ${Math.max(1,Math.round(d/7))} week${Math.round(d/7)===1?"":"s"}. Start the Board application and NCLEX steps now so you can test soon after graduation.`:"Finish your Board application and NCLEX steps so you can start work as an RN.",link:"#journey-license",linkLabel:"Open my RN license steps"})}}}
  // upcoming application deadlines
  state.apps.forEach(a=>{if(a.deadline&&a.status!=="Closed"&&a.status!=="Applied"){const d=daysUntil(a.deadline);if(d>=0&&d<=21)steps.push({id:"app-"+a.id,priority:2,title:`${a.title} deadline in ${d} day${d===1?"":"s"}`,body:`Status: ${a.status}.`,link:"#apps",linkLabel:"Open tracker"})}});
  if(!steps.length){
    steps.push({id:"where",priority:50,title:"Tell me where you are in school",body:"Tell me where you are in school, and I'll help you see what you can do now and what to prepare for next.",link:"#journey",linkLabel:"Set my place in school"});

  }
  return steps.filter(s=>!state.dismissed.includes(s.id)).sort((a,b)=>a.priority-b.priority);
}

function fixText(text,mode){
  if(!text)return {text,changes:[]};
  const changes=[]; let t=text.replace(/[ \t]+/g," ").replace(/ +\n/g,"\n").trim();
  t=t.replace(/\b[A-Za-z]+\b/g,w=>{const lw=w.toLowerCase();const fix=MISSPELL[lw];if(!fix)return w;const out=(w[0]===w[0].toUpperCase())?fix[0].toUpperCase()+fix.slice(1):fix;if(out!==w)changes.push(`${w} to ${out}`);return out});
  const before=t;
  t=t.replace(/\bi\b(?=[\s,.'!?]|$)/g,"I").replace(/\bi'(m|ve|ll|d)\b/g,"I'$1");
  if(mode==="words"&&t===t.toLowerCase()){const small=new Set(["of","and","the","at","for","in","on","to","a","an","or"]);t=t.split(" ").map((w,i)=>(i>0&&small.has(w))?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" ").replace(/\bCa\b/,"CA")}
  if(mode==="first")t=t.charAt(0).toUpperCase()+t.slice(1);
  if(mode==="sentences")t=t.split("\n").map(l=>{l=l.replace(/^([-*•]\s*)/,"");return l.charAt(0).toUpperCase()+l.slice(1)}).join("\n").replace(/([.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  if(t!==before)changes.push("capitalization");
  return {text:t,changes};
}
/* Suggested rewording of a line the student wrote. Shown as an offer; never applied without a tap. */
function polishLine(line){
  let l=fixText(line,"plain").text.trim().replace(/^[-*•]\s*/,"");
  l=l.replace(/^i\s+was\s+responsible\s+for\s+/i,"").replace(/^responsible\s+for\s+/i,"").replace(/^i\s+(?=\w)/i,"").replace(/^my\s+job\s+was\s+to\s+/i,"").replace(/^i\s+had\s+to\s+/i,"");
  l=l.replace(/\.$/,"");
  return l.charAt(0).toUpperCase()+l.slice(1);
}

function bulletSuggestions(e){
  const key=`${e.type||""} ${e.title||""} ${e.org||""}`; const have=(e.bullets||"").toLowerCase();
  let out=[]; BULLET_LIB.forEach(([re,list])=>{if(re.test(key))out.push(...list)});

  return [...new Set(out)].filter(s=>!have.includes(s.toLowerCase())).slice(0,6);

function choice(prompt,label,path,options,opt={}){
  const v=getP(state,path)??""; const id="c_"+path.replace(/\W/g,"_");
  const isOther=v!==""&&!options.includes(v); const other=isOther||state._other===path;
  return `<label class="f" for="${id}">${prompt?`<span class="prompt">${esc(prompt)}</span>`:""}<span class="flabel">${esc(label)}${opt.optional===false?"":" (optional)"}</span>
   <select id="${id}" data-choice="${path}"><option value="">Choose</option>${options.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}<option value="__other" ${other?"selected":""}>${esc(opt.otherLabel||"Other (type my own)")}</option></select></label>

}
function chips(prompt,label,path,options,otherPath,otherLabel){
  const sel=(getP(state,path)||"").split(", ").filter(Boolean);
  return `<div class="f"><span class="prompt">${esc(prompt)}</span><span class="flabel">${esc(label)} (optional, pick any)</span>
   <div class="pill-row" role="group" aria-label="${esc(label)}">${options.map(o=>`<button type="button" class="pill" data-act="chip" data-path="${path}" data-val="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join("")}</div>
   ${otherPath?`<label class="f" style="margin-top:.5rem"><span class="flabel">${esc(otherLabel||"Something else? Type it here")}</span><input type="text" data-bind="${otherPath}" data-fix="first" value="${esc(getP(state,otherPath)||"")}" spellcheck="true" autocapitalize="sentences"></label>`:""}</div>`;

function monthYear(label,path,allowPresent){
  const v=getP(state,path)||""; const [m,y]=v==="Present"?["Present",""]:v.split(" ");

/* ----- résumé generation: only uses what the student entered. Gaps become visible placeholders. ----- */
function ph(t){return `<span class="ph" data-ph="1" data-orig="[${esc(t)}]">[${esc(t)}]</span>`}
/* A placeholder the student typed over becomes real text. */
function settlePlaceholders(root){root.querySelectorAll("[data-ph]").forEach(e=>{if(e.textContent!==e.dataset.orig){e.replaceWith(document.createTextNode(e.textContent))}})}
function hasBlanks(html){const t=document.createElement("div");t.innerHTML=html;settlePlaceholders(t);return t.querySelectorAll("[data-ph]").length>0}
function isExpired(c){return !!(c.expires&&daysUntil(c.expires)<0)}
function resumeItems(){
  const P=state.profile, items=[];
  P.experience.forEach(e=>items.push({id:"exp-"+e.id,label:`${e.title||"Experience"}${e.org?", "+e.org:""}`,group:"Experience"}));
  DATA.curriculum.courses.forEach(c=>{const cc=P.education.courses[c.code];if(cc&&cc.clinical&&active(c.code))items.push({id:"clin-"+c.code,label:`${c.nick} clinical (supervised student)`,group:"Clinical"})});
  P.credentials.filter(c=>c.kind==="held"&&!isExpired(c)).forEach(c=>items.push({id:"cred-"+c.id,label:c.name||c.key,group:"Credentials"}));
  P.skills.forEach(s=>items.push({id:"skill-"+s.id,label:`${s.name} (${s.kind==="classroom"?"classroom":s.kind==="supervised"?"supervised practice":"qualified"})`,group:"Skills",defaultOff:s.kind==="classroom"}));
  P.languages.forEach(l=>items.push({id:"lang-"+l.id,label:l.name,group:"Languages"}));
  P.accomplishments.filter(a=>RESUME_ACC_TYPES.includes(a.type)).forEach(a=>items.push({id:"acc-"+a.id,label:a.title,group:"Awards and projects"}));
  if(P.education.gpa)items.push({id:"gpa",label:"GPA",group:"Education",defaultOff:!P.education.showGpa});
  return items;
}
function buildResumeHTML(doc){
  const P=state.profile, A=P.about, ex=new Set(doc.excludes||[]);
  const nm=(A.useLegal&&A.legalName)?A.legalName:(A.preferredName||A.legalName);
  const contact=[A.showCity&&A.city?esc(A.city):"",A.showEmail&&A.email?esc(A.email):"",A.showPhone&&A.phone?esc(A.phone):""].filter(Boolean);
  let h=`<h1>${nm?esc(nm):ph("Your name")}</h1><div class="contact">${contact.length?contact.join(" &nbsp;|&nbsp; "):ph("Contact details: add in My Story")}</div>`;
  h+=doc.summary?`<p>${esc(doc.summary)}</p>`:`<p>${ph("Optional: a one or two sentence summary. Pick one above or write your own")}</p>`;
  // Education
  const E=P.education;
  h+=`<h2>Education</h2><div class="ent"><b>${E.program?esc(E.program):ph("Program")}</b>, ${E.school?esc(E.school):ph("School")}${/simpson/i.test(E.school||"")?", Redding, CA":""}<br>${E.expectedGrad?"Expected graduation: "+fmtDate(E.expectedGrad):ph("Expected graduation date")}`;
  const gpaOn=E.showGpa?!ex.has("gpa"):(doc.includeClassroom||[]).includes("gpa");
  if(E.gpa&&gpaOn)h+=`<br>GPA: ${esc(E.gpa)}`;
  {const hon=[E.honors,E.honorsOther].filter(Boolean).join(", ");if(hon)h+=`<br>Honors: ${esc(hon)}`;}
  h+=`</div>`;
  if(E.prevEducation)h+=`<div class="ent">${esc(E.prevEducation).replace(/\n/g,"<br>")}</div>`;
  // Clinical (always labeled supervised student)
  const clin=DATA.curriculum.courses.filter(c=>{const cc=E.courses[c.code];return cc&&cc.clinical&&active(c.code)&&!ex.has("clin-"+c.code)});
  if(clin.length){h+=`<h2>Supervised Student Clinical Experience</h2><ul>${clin.map(c=>{const cc=E.courses[c.code];return `<li>${esc(c.name)} (${esc(c.code)}): supervised student clinical rotation${(()=>{const sites=[cc.site,cc.siteOther].filter(Boolean).join(", "),units=[cc.unit,cc.unitOther].filter(Boolean).join(", ");return (sites||units)?", "+esc([sites,units?"("+units+")":""].filter(Boolean).join(" ")):", "+ph("clinical site")})()}${cc.status==="in_progress"?" (in progress)":""}</li>`}).join("")}</ul>`}
  // Experience by type
  EXP_TYPES.forEach(([t,lab])=>{
    const rows=P.experience.filter(e=>(e.type||"employment")===t&&!ex.has("exp-"+e.id));
    if(!rows.length)return;
    h+=`<h2>${t==="employment"?"Work Experience":lab}</h2>`+rows.map(e=>{
      const b=(e.bullets||"").split("\n").map(s=>s.trim()).filter(Boolean);
      return `<div class="ent"><b>${e.title?esc(e.title):ph("role")}</b>${e.org?", "+esc(e.org):""}${e.location?", "+esc(e.location):""}<br><span>${e.start||e.end?esc(e.start||"")+" to "+esc(e.end||""):ph("dates")}</span>${b.length?`<ul>${b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<ul><li>${ph("what you did, in your own words")}</li></ul>`}</div>`}).join("");
  });
  const creds=P.credentials.filter(c=>c.kind==="held"&&!isExpired(c)&&!ex.has("cred-"+c.id));
  if(creds.length)h+=`<h2>Certifications</h2><ul>${creds.map(c=>`<li>${esc(c.name||CRED_KEYS.find(k=>k.key===c.key)?.label||"")}${c.issuer?", "+esc(c.issuer):""}${c.expires?" (expires "+fmtDate(c.expires)+")":""}</li>`).join("")}</ul>`;
  const skills=P.skills.filter(s=>{const id="skill-"+s.id;return s.name&&!(ex.has(id))&&!(s.kind==="classroom"&&!(doc.includeClassroom||[]).includes(id))});
  if(skills.length)h+=`<h2>Skills</h2><ul>${skills.map(s=>`<li>${esc(s.name)}${s.kind==="supervised"?" (supervised student practice)":s.kind==="classroom"?" (classroom and lab)":""}</li>`).join("")}</ul>`;
  const langs=P.languages.filter(l=>l.name&&!ex.has("lang-"+l.id));
  if(langs.length)h+=`<h2>Languages</h2><ul>${langs.map(l=>`<li>${esc(l.name)}${l.level?" ("+esc(l.level)+", self-described)":""}</li>`).join("")}</ul>`;
  const acc=P.accomplishments.filter(a=>RESUME_ACC_TYPES.includes(a.type)&&a.title&&!ex.has("acc-"+a.id));
  if(acc.length)h+=`<h2>Awards and Projects</h2><ul>${acc.map(a=>`<li>${esc(a.title)}${a.detail?": "+esc(a.detail):""}</li>`).join("")}</ul>`;
  return h;
}

function cleanHTML(html){const t=document.createElement("div");t.innerHTML=html;settlePlaceholders(t);t.querySelectorAll("[data-ph]").forEach(e=>{const li=e.closest("li");if(li&&li.textContent.trim()===e.textContent.trim())li.remove();else if(e.parentElement&&e.parentElement.tagName==="P"&&e.parentElement.textContent.trim()===e.textContent.trim())e.parentElement.remove();else e.remove()});t.querySelectorAll("ul").forEach(u=>{if(!u.children.length)u.remove()});return t.innerHTML}
function htmlToText(html){const t=document.createElement("div");t.innerHTML=html.replace(/<li>/g,"<li>- ").replace(/<\/(h1|h2|div|p|li)>/g,"\n</$1>").replace(/<br>/g,"\n");return t.textContent.replace(/\n{3,}/g,"\n\n").trim()}
function printHTML(html){const pa=$("#print-area");pa.innerHTML=`<div class="doc">${html}</div>`;try{window.print()}catch(_){toast("Printing isn't available in this window. Use Copy text.")}setTimeout(()=>pa.innerHTML="",1000)}

I'm applying for ${r.opportunity||"[opportunity]"}, and I'd be grateful if you would consider writing a recommendation for me. ${r.relationship?"You know my work as "+r.relationship.trim().replace(/\.$/,"").replace(/^My /,"my ")+".":"[How they know you]"}

const FAIR_SEED=Math.floor(Math.random()*1e9);

   : sub==="funding"?`<div class="ctx">Help paying for school and help managing debt after school are different. Scholarships, grants, loans, reimbursement, forgiveness, and service-based repayment each work differently, and programs can't always be combined.</div>`:"";

  <p class="note">Every listing here was found on the organization's own site or a job posting on ${fmtDate("2026-11-16")}. "Unverified" means I haven't confirmed it's open today.</p>`;

function statusBadge(r){
  const stale=isStale(r.verified);
  const m={open:["Open","b-ok"],closed:["Closed","b-red"],unverified:["Status unverified","b-warn"],ongoing:["Ongoing resource","b-info"]}[r.status]||["Unknown","b-warn"];
  return `<span class="badge ${m[1]}">${m[0]}</span> ${stale?`<span class="badge b-warn">Needs recheck</span>`:""}`;
}
function fitFor(r){
  const have=heldKeys(); const out=[];
  (r.required||[]).forEach(q=>{ if(!q.key) out.push(["unknown",q.label]); else if(q.key==="bls30") out.push([have.has("bls")?"met":"note",q.label+(have.has("bls")?"":": you haven't reported BLS yet, and this posting allows 30 days after hire")]); else out.push([have.has(q.key)?"met":"missing",q.label]); });
  return out;
}

function viewNext(){
  const have=heldKeys();
  const grouped={now:[],train:[],later:[],unknown:[]};
  DATA.roles.forEach(r=>{
    if(!r.verified){grouped.unknown.push(r);return}
    if(r.later){grouped.later.push(r);return}
    const missing=r.req.filter(q=>q.key&&q.key!=="bls30"&&!have.has(q.key));
    (missing.length?grouped.train:grouped.now).push(r);
  });
  const roleCard=r=>{
    const present=r.req.filter(q=>q.key&&have.has(q.key)).map(q=>q.label);
    const missing=r.req.filter(q=>q.key&&q.key!=="bls30"&&!have.has(q.key)).map(q=>q.label);
    const unknown=r.req.filter(q=>!q.key||q.key==="bls30").map(q=>q.label);
    const app=r.apply?DATA.resources.find(x=>x.id===r.apply):null;
    return `<div class="card">${r.jobType&&goalsList("jobTypes").includes(r.jobType)?`<span class="match">A job type you picked</span>`:""}<h3>${esc(r.name)}</h3><dl class="kv">
     <dt>Already reported</dt><dd>${present.length?esc(present.join("; ")):"Nothing matching yet"}</dd>
     <dt>Employer or state requires</dt><dd>${r.req.length?esc(r.req.map(q=>q.label).join("; ")):"Not yet verified"}</dd>
     ${missing.length?`<dt>Missing</dt><dd>${esc(missing.join("; "))}</dd>`:""}
     ${unknown.length?`<dt>Check</dt><dd>${esc(unknown.join("; "))}</dd>`:""}
     ${r.training?`<dt>Training needed</dt><dd>${esc(r.training)}</dd>`:""}
     <dt>Who verifies</dt><dd>${esc(r.verify)}</dd>
     <dt>Based on</dt><dd>${esc(r.source)}</dd></dl>
     <div class="row">${app?`<a class="btn small sec" href="#opps-all" data-act="go" data-to="#opps-${app.cat==="job"?"jobs":"all"}">See listing</a>`:""}${r.link?`<a class="btn small sec" href="${r.link}">Open guide</a>`:""}${r.url?`<a class="btn small sec" href="${esc(r.url)}" target="_blank" rel="noopener">Official guidance</a>`:""}</div></div>`;
  };
  const sec=(t,arr,empty)=>`<h2>${t}</h2>${arr.length?arr.map(roleCard).join(""):`<p class="note">${empty}</p>`}`;
  return `<p class="lead">Grouped by what you've reported. Similar job titles can have different requirements, so each one is checked separately.</p>
   <div class="ctx">Possible fit based on what you've shared. Confirm current requirements with the employer.</div>
   ${sec("1. Explore applying now",grouped.now,"Nothing yet based on what you've shared.")}
   ${sec("2. Employer training available",[], "No employer-trained openings are verified right now. I only list these when an employer explicitly offers training.")}

   ${sec("4. Prepare for later",grouped.later,"None.")}

   <div class="card">${grouped.unknown.map(r=>`<div class="list-item"><b>${esc(r.name)}</b> <span class="note">${esc(r.source)}</span></div>`).join("")}</div>
   <div class="card"><h3>Before paying for more training</h3><p class="note" style="margin:0">Compare the total cost, time, time until you could work, clinical placement needs, how long until RN graduation, available shifts, commute, published pay, and any repayment obligations. Paid work or employer-supported training usually beats collecting credentials.</p></div>`;
}

/* ------------------------- guided tour (read-only) -------------------------
   Willa is fictional. The tour swaps her in only while drawing a preview,
   and save() is disabled while touring, so the student's own data is never touched. */
function tourState(){
  const s=blankState(); s.onboarded=true; s.lastExport=new Date().toISOString().slice(0,10);
  Object.assign(s.profile.about,{preferredName:"Willa",email:"willa@example.com",phone:"555-0100",city:"Redding, CA"});
  Object.assign(s.profile.education,{school:"Simpson University",program:"Bachelor of Science in Nursing (BSN)",enrolledConfirmed:true,fullTime:true,expectedGrad:"2028-05-06"});
  ["PREREQ","NURS 2310","NURS 2320","NURS 2330","NURS 2340"].forEach(c=>s.profile.education.courses[c]={status:"completed"});
  ["NURS 3310","NURS 3320","NURS 3330","NURS 3340"].forEach(c=>s.profile.education.courses[c]={status:"in_progress"});
  s.profile.education.courses["NURS 2310"].clinical=true;
  s.profile.experience=[{id:"t1",type:"employment",title:"Barista",org:"Downtown coffee shop",location:"Redding, CA",start:"2023",end:"Present",bullets:"Trained four new hires on opening procedures\nKept orders moving during the morning rush on a two-person shift"},
    {id:"t2",type:"caregiving",title:"Family caregiver",org:"",location:"",start:"2021",end:"2023",bullets:"Helped my grandmother with meals, getting around the house, and medication reminders"}];
  s.profile.credentials=[{id:"t3",key:"bls",name:"BLS Provider",issuer:"American Heart Association",expires:new Date(TODAY.getTime()+40*864e5).toISOString().slice(0,10),kind:"held"}];
  s.profile.skills=[{id:"t4",name:"Vital signs",kind:"supervised"},{id:"t5",name:"Sterile technique",kind:"classroom"}];
  s.profile.accomplishments=[{id:"t6",type:"Teamwork",title:"Covered a coworker's shifts during finals",detail:"Swapped schedules so a teammate could study, and we both kept our hours."}];
  return s;
}

views.tour=(sub)=>{
  const n=TOUR.length; const i=Math.min(n-1,Math.max(0,(parseInt(sub,10)||1)-1)); const t=TOUR[i];
  const body=t.show?withTour(t.show):"";
  const last=i===n-1;
  return `<p class="note" style="margin:.2rem 0">Tour, step ${i+1} of ${n}</p>
  <div class="dots" aria-hidden="true">${TOUR.map((_,k)=>`<span class="${k<=i?"on":""}"></span>`).join("")}</div>
  <h1>${esc(t.title)}</h1><p class="lead">${esc(t.lead)}</p>
  ${body?preview(body):""}
  <div class="tour-why">${esc(t.why)}</div>
  ${last?`<div class="actions"><a class="bigbtn" href="#journey" data-act="onboarded">Tell me where I am in school<span>Set your courses in a minute</span></a><a class="bigbtn" href="#create-resume" data-act="onboarded">Build my résumé<span>Start with just your name</span></a><a class="bigbtn" href="#home" data-act="onboarded">Go to Home<span>Look around first</span></a></div>`:""}
  <div class="tour-nav">${i>0?`<a class="btn sec" href="#tour-${i}">Back</a>`:`<span></span>`}
   ${last?"":`<a class="btn" href="#tour-${i+2}">Next</a>`}</div>
  <p style="text-align:center"><a class="btn ghost small" href="#home">Exit tour</a></p>`;
};

/* ------------------------- router ------------------------- */
function render(){
  const h=location.hash.replace(/^#\/?/,"")||"home";
  const i=h.indexOf("-");const view=i<0?h:h.slice(0,i), sub=i<0?"":h.slice(i+1);
  if(view==="admin"){location.replace("#home");return}
  const fn=views[view]||views.home;
  document.documentElement.style.setProperty("--scale",state.textScale||1);
  $("#demoBanner").innerHTML=(sharedMode()?`<div class="demo-banner" role="note"><b>Shared computer mode.</b> Your information clears when you close this browser. <button class="btn small sec" data-act="delete-all">Clear now</button></div>`:"");
  $("#main").innerHTML=fn(sub)+`<footer class="foot">WillHelp is an independent resource designed to support Simpson University nursing students. It is not an official university service and is not endorsed by Simpson University unless expressly stated. Automated guidance, not a conversation with Will. <a href="#about">Disclaimer and privacy</a></footer>`;
  const navKey={journey:"home",apps:"home",tour:"home",about:""}[view]??view;
  document.querySelectorAll("nav.main a").forEach(a=>{if(a.dataset.nav===navKey)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.title=`WillHelp: ${({home:"Home",story:"My Story",create:"Create",opps:"Opportunities",support:"Support",journey:"My Nursing Journey",tour:"Tour",apps:"Applications",about:"About"})[view]||"Home"}`;
}

let saveTimer;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bind){
    if(t.dataset.bind==="_newTarget"){state._newTarget=t.value;return}
    setP(state,t.dataset.bind,t.type==="checkbox"?t.checked:t.value);
    {const mk=t.dataset.bind.match(/^profile\.credentials\.(\d+)\.key$/);if(mk){const c=state.profile.credentials[+mk[1]];const k=CRED_KEYS.find(x=>x.key===t.value);if(c&&k&&k.key!=="other"&&!c.name){c.name=k.label.replace(/ \(.*\)$/,"");if(k.key==="bls"&&!c.issuer)c.issuer="American Heart Association";save();render();return}}}
    if(/^profile\.experience\.\d+\.type$/.test(t.dataset.bind)){save();render();return}
    if(t.dataset.bind==="profile.education.enrolledConfirmed"&&t.checked){const E=state.profile.education;if(!E.school)E.school="Simpson University";if(!E.program)E.program="BSN (pre-licensure)"}
    clearTimeout(saveTimer);saveTimer=setTimeout(save,250);
    if(t.tagName==="SELECT"||t.type==="checkbox"||t.type==="date")save();
  }
  else if(t.dataset.rec!==undefined){state._rec[t.dataset.rec]=t.value;if(t.dataset.rec==="message")state._rec.edited=true;save()}
  else if(t.dataset.app!==undefined){state.apps[+t.dataset.app][t.dataset.k]=t.value;save()}
  else if(t.dataset.precep){state.precep[t.dataset.precep]=t.value;save()}
  else if(t.hasAttribute("data-cnaletter")){state.cna.letter=t.value;save()}
  else if(t.dataset.coursefield){const c=state.profile.education.courses[t.dataset.coursefield]||(state.profile.education.courses[t.dataset.coursefield]={});c[t.dataset.k]=t.type==="checkbox"?t.checked:t.value;save()}
});
document.addEventListener("change",e=>{

  if(t.dataset.fix&&t.dataset.fix!=="none"&&(t.tagName==="TEXTAREA"||t.type==="text")){
    const r=fixText(t.value,t.dataset.fix);

  }

  if(t.dataset.rerender){save();render();return}
  if(t.type==="email"&&t.value){const v=t.value.trim().toLowerCase(),m=v.match(/@(.+)$/);const TY={"gmial.com":"gmail.com","gmal.com":"gmail.com","gmai.com":"gmail.com","gmail.co":"gmail.com","gnail.com":"gmail.com","gamil.com":"gmail.com","yaho.com":"yahoo.com","yahooo.com":"yahoo.com","yahoo.co":"yahoo.com","hotmial.com":"hotmail.com","hotmai.com":"hotmail.com","outlok.com":"outlook.com","outloo.com":"outlook.com","icoud.com":"icloud.com","iclod.com":"icloud.com","simpsonu.ed":"simpsonu.edu","simpson.edu":"simpsonu.edu","simpsonu.com":"simpsonu.edu"};
    if(m&&TY[m[1]]){const nv=v.replace(/@.+$/,"@"+TY[m[1]]);t.value=nv;if(t.dataset.bind){setP(state,t.dataset.bind,nv);save()}toast(`Changed ${m[1]} to ${TY[m[1]]}. Change it back if I got it wrong.`)}

  if(t.dataset.course){const c=state.profile.education.courses[t.dataset.course]||(state.profile.education.courses[t.dataset.course]={});c.status=t.value;c.reported="student";save();render();toast("Updated. Next steps refreshed.")}

  else if(t.dataset.recacc){const r=state._rec;r.acc=t.checked?[...r.acc,t.dataset.recacc]:r.acc.filter(x=>x!==t.dataset.recacc)}
  else if(t.dataset.recdoc){const r=state._rec;r.docs=t.checked?[...r.docs,t.dataset.recdoc]:r.docs.filter(x=>x!==t.dataset.recdoc)}
  else if(t.hasAttribute("data-cnastep")){state.cna.step=+t.value;save();render()}
  else if(t.dataset.cnacheck){state.cna.checks[t.dataset.cnacheck]=t.checked;save()}

  else if(t.dataset.actChange==="import"){const f=t.files[0];if(!f)return;f.text().then(txt=>{try{const o=JSON.parse(txt);if(!o||!o.profile)throw 0;state=deepMerge(blankState(),o);save();render();toast("Backup imported.")}catch(_){toast("That file isn't a WillHelp backup.")}})}
});

    jumpto(){const el=document.getElementById(b.dataset.to);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.focus({preventScroll:true})}},
    cmpadd(){state.compliance.push({id:"c"+Date.now().toString(36),label:b.dataset.label==="Other"?"":b.dataset.label,preset:b.dataset.label,done:"",due:""});save();render()},
    cmpdel(){const i=+b.dataset.i;if(!confirmTap("cmpdel"+i,"Remove this item?"))return;state.compliance.splice(i,1);save();render()},
    stage(){if(anyCourseData()&&!confirmTap("stage","This replaces the course statuses you already set."))return;const i=+b.dataset.i;const terms=DATA.curriculum.terms;DATA.curriculum.courses.forEach(c=>{const ti=terms.findIndex(t=>t.id===c.term);const st=ti<i?"completed":ti===i?"in_progress":"planned";const cur=state.profile.education.courses[c.code]||{};state.profile.education.courses[c.code]={...cur,status:st,reported:"student"}});state.onboarded=true;save();render();toast("Here's what I assumed from Simpson's published plan. Tell me what's different below.")},
    pathflag(){const k=b.dataset.k;state.profile.education.path[k]=!state.profile.education.path[k];save();render()},
    add(){const arr=b.dataset.arr;const base={experience:{type:"employment"},credentials:{kind:"held"},skills:{kind:"supervised"},languages:{},accomplishments:{type:"Teamwork"}}[arr];state.profile[arr].push({id:uid(),...base});save();render()},
    rm(){state.profile[b.dataset.arr].splice(+b.dataset.i,1);save();render()},
    newresume(){const target=state._newTarget||"Student employment";const d={id:uid(),kind:"resume",title:`Résumé: ${target}`,target,status:"draft",storyHash:FP.resume(),excludes:[],includeClassroom:[],createdAt:new Date().toISOString().slice(0,10),updatedAt:new Date().toISOString().slice(0,10)};state.docs.push(d);state.activeDoc=d.id;save();render()},
    opendoc(){state.activeDoc=b.dataset.id;save();if(location.hash==="#create-resume")render()},
    editwording(){const d=currentDraft();if(state._editing){settlePlaceholders($("#docPreview"));d.customHtml=$("#docPreview").innerHTML;d.storyHash=FP.resume();d.updatedAt=new Date().toISOString().slice(0,10);save();state._editing=false;toast("Your wording is saved on this draft.")}else state._editing=true;render()},
    refresh(){const d=currentDraft();if(d.customHtml&&!confirmTap("refresh","This replaces your edited wording."))return;d.customHtml=null;d.storyHash=FP.resume();d.updatedAt=new Date().toISOString().slice(0,10);save();render();toast("Draft updated from your story. Finalized versions were not touched.")},
    copyresume(){const d=currentDraft();copyText(htmlToText(cleanHTML(d.customHtml||buildResumeHTML(d))))},
    printdraft(){const d=currentDraft();printHTML(cleanHTML(d.customHtml||buildResumeHTML(d)))},
    "dl-txt"(){const d=currentDraft();download(`${d.title.replace(/[^\w ]/g,"")}.txt`,htmlToText(cleanHTML(d.customHtml||buildResumeHTML(d))))},
    "dl-doc"(){const d=currentDraft();const body=cleanHTML(d.customHtml||buildResumeHTML(d));download(`${d.title.replace(/[^\w ]/g,"")}.doc`,`<html><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}h1{font-size:18pt;margin:0}h2{font-size:11pt;text-transform:uppercase;border-bottom:1px solid #444}</style></head><body>${body}</body></html>`,"application/msword")},
    finalize(){const d=currentDraft();const html=cleanHTML(d.customHtml||buildResumeHTML(d));if(hasBlanks(d.customHtml||buildResumeHTML(d))&&!confirmTap("finalize","Unfilled blanks will be left out of the finalized version."))return;const n=state.docs.filter(x=>x.kind==="resume"&&x.status==="final"&&x.target===d.target).length+1;state.docs.push({id:uid(),kind:"resume",title:`${d.title} (version ${n})`,target:d.target,status:"final",html,finalizedAt:new Date().toISOString().slice(0,10)});save();render();toast("Finalized. This version won't change when your story changes.")},
    discard(){const d=currentDraft();if(!confirmTap("discard","Delete this draft? Finalized versions stay."))return;state.docs=state.docs.filter(x=>x.id!==d.id);save();render()},
    viewfinal(){const d=state.docs.find(x=>x.id===b.dataset.id);const w=document.createElement("div");w.className="card";w.innerHTML=`<h3>${esc(d.title)}</h3><div class="doc">${d.html}</div>`;b.closest(".card").after(w);b.disabled=true},
    printdoc(){const d=state.docs.find(x=>x.id===b.dataset.id);printHTML(d.html)},
    genrec(){if(state._rec.message&&state._rec.edited&&!confirmTap("genrec","This replaces the message you edited."))return;state._rec.edited=false;genRec();state._rec.msgHash=FP.rec();render();toast("Here's a draft. Tell me what you'd like to change.")},
    copyrec(){copyText(state._rec.message)},
    dlpacket(){download("recommendation-packet.txt",state._rec.message+"\n\n-----\n\n"+htmlToText(recPacket()))},
    printpacket(){printHTML(recPacket())},
    copycna(){copyText(state.cna.letter)},
    resetcna(){state.cna.letter=cnaLetter();state.cna.letterHash=FP.cna();save();render()},
    saveopp(){const r=DATA.resources.find(x=>x.id===b.dataset.id);state.apps.push({id:uid(),resId:r.id,title:`${r.title}, ${r.org}`,status:"Saved",deadline:"",notes:""});save();render();toast("Saved to your tracker.")},
    report(){const r=DATA.resources.find(x=>x.id===b.dataset.id);if(!DATA.settings.reportEmail){toast("Reporting isn't set up in this prototype yet. Please tell your instructor.");return}location.href=`mailto:${DATA.settings.reportEmail}?subject=${encodeURIComponent("WillHelp outdated info: "+r.title)}&body=${encodeURIComponent("Listing: "+r.title+"\nWhat looks outdated:\n")}`},
    addapp(){state.apps.push({id:uid(),title:"",status:"Saved"});save();render()},
    rmapp(){state.apps.splice(+b.dataset.i,1);save();render()},
    export(){state.lastExport=new Date().toISOString().slice(0,10);save();const o={...state};delete o._rec;delete o._editing;download(`WillHelp-Backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(o,null,2),"application/json");toast("Backup downloaded.")},
    "delete-all"(){if(!confirmTap("delall","This deletes everything WillHelp stored on this device and can't be undone."))return;try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(_){}state=blankState();render();toast("Everything was deleted from this device.")},
  };
  if(acts[a]){if(b.tagName==="BUTTON")e.preventDefault();acts[a]()}
});
render();
</script>
